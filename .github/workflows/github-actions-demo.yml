name: CI/CD Завод вафельных стаканчиков

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # Проверка бэкенда
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install fastapi uvicorn psycopg2-binary sqlalchemy pytest pytest-asyncio httpx
        working-directory: ./backend
      
      - name: Create tests folder
        run: |
          mkdir -p tests
          echo "def test_hello(): assert 1 + 1 == 2" > tests/test_main.py
        working-directory: ./backend
      
      - name: Run tests
        run: pytest -v
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

  # Проверка фронтенда
  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
        working-directory: ./frontend
      
      - name: Build React app
        run: CI=false npm run build
        working-directory: ./frontend

  # Проверка структуры
  check-structure:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check files
        run: |
          echo "Проверка структуры проекта:"
          
          if [ -d "backend" ]; then
            echo "✓ backend exists"
          else
            echo "✗ backend missing"
            exit 1
          fi
          
          if [ -f "backend/main.py" ]; then
            echo "✓ main.py exists"
          else
            echo "✗ main.py missing"
            exit 1
          fi
          
          if [ -d "frontend" ]; then
            echo "✓ frontend exists"
          else
            echo "✗ frontend missing"
            exit 1
          fi
          
          if [ -f "frontend/package.json" ]; then
            echo "✓ package.json exists"
          else
            echo "✗ package.json missing"
            exit 1
          fi
          
          echo "Все проверки пройдены!"
