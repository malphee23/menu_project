  <meta charset="UTF-8" />

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { background: #f6f8fa; padding: 16px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #ddd; margin-bottom: 20px; }

    button:hover { background: #0056b3; }

  </style>

<body>
  <div id="root"></div>

  <script type="text/babel">
  const API_BASE = 'http://26.234.56.246:8000';
    

    const Login = ({ onLogin }) => {
  const [login, setLogin] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [error, setError] = React.useState('');

  const handleSubmit = (e) => {
    e.preventDefault();
    setError('');

    fetch(`${API_BASE}/admin/admins/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, password })
    })
      .then(res => {
        if (!res.ok) {
          if (res.status === 401) throw new Error('Неверный логин или пароль');
          if (res.status === 422) throw new Error('Ошибка в данных');
          throw new Error('Ошибка сервера');
        }
        return res.json();
      })
      .then(data => {
        // Ожидаем: { token: "...", role: "superuser", user_id: 1 }
        localStorage.setItem('admin_token', data.token);
        localStorage.setItem('admin_role', data.role);
        onLogin(data.role);
      })
      .catch(err => {
        setError(err.message);
      });
  };

  return (
    <div className="login-form">
      <h2>Вход в систему</h2>
      <form onSubmit={handleSubmit}>
        <div><input
          type="text"
          placeholder="Логин"
          value={login}
          onChange={e => setLogin(e.target.value)}
          required
        /></div>
        <div><input
          type="password"
          placeholder="Пароль"
          value={password}
          onChange={e => setPassword(e.target.value)}
          required
        /></div>
        {error && <div style={{color:'red', marginTop:'8px'}}>{error}</div>}
        <button type="submit">Войти</button>
      </form>
    </div>
  );
};


  const AdminPanel = ({ userRole }) => {
  const [activeTab, setActiveTab] = React.useState('dishes');

  // Определяем доступные вкладки по роли
  const getTabs = () => {
    switch (userRole) {
      case 'superuser':
        return [
          { id: 'dishes', name: 'Блюда' },
          { id: 'users', name: 'Пользователи' },
          { id: 'admin-users', name: 'Админ-аккаунты' },
          { id: 'orders', name: 'Заказы' },
          { id: 'stock', name: 'Остатки' },
          { id: 'ingredients', name: 'Ингредиенты' },
          { id: 'bar-items', name: 'Напитки' },
          { id: 'reviews', name: 'Отзывы' }
        ];
      case 'cook':
        return [
          { id: 'dishes', name: 'Блюда' },
          { id: 'bar-items', name: 'Напитки' },
          { id: 'ingredients', name: 'Ингредиенты' },
          { id: 'orders', name: 'Заказы' }
        ];
      case 'waiter':
        return [
          { id: 'dishes', name: 'Блюда' },
          { id: 'bar-items', name: 'Напитки' },
          { id: 'users', name: 'Пользователи' },
          { id: 'orders', name: 'Заказы' }
        ];
      default:
        return [{ id: 'dishes', name: 'Блюда' }];
    }
  };

  const tabs = getTabs();

  // Если выбранная вкладка недоступна — переключиться на первую
  React.useEffect(() => {
    if (!tabs.some(t => t.id === activeTab)) {
      setActiveTab(tabs[0].id);
    }
  }, [activeTab, tabs]);

  const renderTab = () => {
    switch (activeTab) {
      case 'dishes': return <DishesTab />;
      case 'users': return <UsersTab />;
      case 'admin-users': return <AdminUsersTab />;
      case 'orders': return <OrdersTab />;
      case 'stock': return <StockTab />;
      case 'ingredients': return <IngredientsTab />;
      case 'bar-items': return <BarItemsTab />;
      case 'reviews': return <ReviewsTab />;
      default: return <DishesTab />;
    }
  };

  const roleLabel = {
    superuser: 'Администратор системы',
    cook: 'Повар',
    waiter: 'Официант'
  }[userRole] || 'Пользователь';

  return (
    <div className="container">
      <header>
        <div style={{ display: 'flex', alignItems: 'center' }}>
          <h1>Панель управления ({roleLabel})</h1>
          <button
            onClick={() => {
              localStorage.removeItem('admin_token');
              localStorage.removeItem('admin_role');
              window.location.reload();
            }}
            style={{
              fontSize: '12px',
              marginLeft: '12px',
              padding: '4px 8px',
              background: '#6c757d',
              color: 'white',
              border: 'none',
              borderRadius: '4px',
              cursor: 'pointer'
            }}
          >
            🚪 Выйти
          </button>
        </div>
        <nav>
          {tabs.map(tab => (
            <a
              key={tab.id}
              href="#"
              onClick={e => { e.preventDefault(); setActiveTab(tab.id); }}
            >
              {tab.name}
            </a>
          ))}
        </nav>
      </header>
      {renderTab()}
    </div>
  );
};

const DishesTab = () => {
  const [dishes, setDishes] = React.useState([]);
  const [categories, setCategories] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const [showForm, setShowForm] = React.useState(false);
  const [editingDish, setEditingDish] = React.useState(null);

  // Загрузка блюд и категорий
  React.useEffect(() => {
    Promise.all([
      fetch(`${API_BASE}/admin/dishes`).then(r => r.json()),
      fetch(`${API_BASE}/admin/visit_categories`).then(r => r.json())
    ])
      .then(([dishesData, categoriesData]) => {
        setDishes(Array.isArray(dishesData) ? dishesData : []);
        setCategories(Array.isArray(categoriesData) ? categoriesData : []);
        setLoading(false);
      })
      .catch(err => {
        setError('Ошибка загрузки: ' + err.message);
        setLoading(false);
      });
  }, []);

  // Сохранение (создание / обновление)
  const handleSave = (dishData) => {
    const url = editingDish
      ? `${API_BASE}/admin/dishes/${editingDish.id}`
      : `${API_BASE}/admin/dishes`;
    const method = editingDish ? 'PUT' : 'POST';

    fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dishData)
    })
      .then(res => {
        if (!res.ok) throw new Error(res.statusText || 'Ошибка сохранения');
        return res.json();
      })
      .then(savedDish => {
        if (editingDish) {
          setDishes(dishes.map(d => d.id === savedDish.id ? savedDish : d));
        } else {
          setDishes([...dishes, savedDish]);
        }
        setShowForm(false);
        setEditingDish(null);
      })
      .catch(err => {
        alert('Ошибка: ' + err.message);
      });
  };

  // Удаление
  const handleDelete = (id) => {
    if (!confirm('Удалить блюдо?')) return;
    fetch(`${API_BASE}/admin/dishes/${id}`, { method: 'DELETE' })
      .then(res => {
        if (!res.ok) throw new Error('Не удалось удалить');
        setDishes(dishes.filter(d => d.id !== id));
      })
      .catch(err => {
        alert('Ошибка: ' + err.message);
      });
  };

  // Редактирование
  const handleEdit = (dish) => {
    setEditingDish(dish);
    setShowForm(true);
  };

  if (loading) return <div className="card">Загрузка блюд и категорий...</div>;
  if (error) return <div className="card" style={{ color: 'red' }}>{error}</div>;

  return (
    <div className="card">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <h2>Блюда</h2>
        <button onClick={() => setShowForm(true)}>➕ Добавить блюдо</button>
      </div>

      {showForm && (
        <DishForm
          dish={editingDish}
          categories={categories}
          onSave={handleSave}
          onCancel={() => {
            setShowForm(false);
            setEditingDish(null);
          }}
        />
      )}

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Цена</th>
            <th>Категория</th>
            <th>Доступно</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          {dishes.map(d => (
            <tr key={d.id}>
              <td>{d.id}</td>
              <td>{d.name}</td>
              <td>{d.price} ₽</td>
              <td>
                {categories.find(c => c.id === d.category_id)?.name || `ID ${d.category_id}`}
              </td>
              <td>{d.is_available ? '✅' : '❌'}</td>
              <td>
                <button onClick={() => handleEdit(d)} style={{ fontSize: '12px', padding: '2px 6px', marginRight: '4px' }}>✏️</button>
                <button onClick={() => handleDelete(d.id)} style={{ fontSize: '12px', padding: '2px 6px', background: '#dc3545' }}>🗑️</button>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
};

  };

  if (error) return <div className="card" style={{ color: 'red' }}>{error}</div>;

          }}
        />

            <th>ID</th>
            <th>Название</th>

            <th>Минимум</th>
            <th>Статус</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          {items.map(i => {
            const low = isLowStock(i.current_stock, i.min_stock_level);
            return (
              <tr key={i.id} style={low ? { backgroundColor: '#fff3cd' } : {}}>
                <td>{i.id}</td>
                <td>{i.name}</td>
                <td>{i.unit}</td>
                <td>{i.current_stock || 0}</td>
                <td>{i.min_stock_level || 0}</td>
                <td>

                    '✅ В норме'

                  <button onClick={() => handleDelete(i.id)} style={{ fontSize: '12px', padding: '2px 6px', background: '#dc3545' }}>🗑️</button>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
};

const UsersTab = () => {

  const [loading, setLoading] = React.useState(true);

  // Загрузка списка пользователей
  React.useEffect(() => {
    fetch(`${API_BASE}/admin/users`)
      .then(res => {
        if (!res.ok) throw new Error('Не удалось загрузить пользователей');
        return res.json();
      })
      .then(data => {
        setUsers(Array.isArray(data) ? data : []);
        setLoading(false);
      })
      .catch(err => {
        setError(err.message);
        setLoading(false);
      });
  }, []);

  // Удаление пользователя
  const handleDelete = (id) => {
    if (!confirm('Удалить пользователя? Это действие нельзя отменить.')) return;

    fetch(`${API_BASE}/admin/users/${id}`, {
      method: 'DELETE'
    })
      .then(res => {
        if (!res.ok) throw new Error('Ошибка при удалении');
        // Обновляем список: фильтруем удалённого
        setUsers(users.filter(u => u.id !== id));
      })
      .catch(err => {
        alert('Ошибка: ' + err.message);
      });
  };

  if (loading) return <div className="card">Загрузка...</div>;
  if (error) return <div className="card" style={{color:'red'}}>Ошибка: {error}</div>;

  return (
    <div className="card">
      <h2>Пользователи</h2>

        <p>Нет пользователей</p>
      ) : (
        <table>

              <th>ID</th>
              <th>Логин</th>
              <th>Дата рождения</th>
              <th>Тип диеты</th>
              <th>Стиль питания</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody>
            {users.map(u => (
              <tr key={u.id}>
                <td>{u.id}</td>
                <td>{u.login}</td>
                <td>{u.birth_date ? new Date(u.birth_date).toLocaleDateString('ru-RU') : '—'}</td>
                <td>{u.diet_type || '—'}</td>
                <td>{u.meal_style || '—'}</td>
                <td>
                  <button
                    onClick={() => handleDelete(u.id)}
                    style={{ fontSize: '12px', padding: '4px 8px', background: '#dc3545' }}
                  >
                    🗑️ Удалить
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
};

const OrdersTab = () => {
  const [orders, setOrders] = React.useState([]);
  const [dishes, setDishes] = React.useState([]);
  const [barItems, setBarItems] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const [selectedOrder, setSelectedOrder] = React.useState(null);
  const [orderItems, setOrderItems] = React.useState([]); // 🆕 Отдельно храним позиции

  // Загрузка заказов и справочников
  React.useEffect(() => {
    Promise.all([
      fetch(`${API_BASE}/admin/orders`).then(r => r.json()),
      fetch(`${API_BASE}/admin/dishes`).then(r => r.json()),

      .then(([ordersData, dishesData, barItemsData]) => {
        setOrders(Array.isArray(ordersData) ? ordersData : []);
        setDishes(Array.isArray(dishesData) ? dishesData : []);
        setBarItems(Array.isArray(barItemsData) ? barItemsData : []);
        setLoading(false);
      })
      .catch(err => {
        setError('Ошибка загрузки: ' + err.message);
        setLoading(false);
      });
  }, []);

  // Загрузка позиций заказа при выборе
  React.useEffect(() => {
    if (!selectedOrder) return;
    fetch(`${API_BASE}/admin/order_items?order_id=${selectedOrder.id}`)
      .then(res => res.json())
      .then(data => {
        setOrderItems(Array.isArray(data) ? data : []);
      })
      .catch(err => {
        alert('Не удалось загрузить позиции: ' + err.message);
      });
  }, [selectedOrder]);

  // Удаление заказа
  const handleDelete = (id) => {
    if (!confirm('Удалить заказ и все его позиции?')) return;
    fetch(`${API_BASE}/admin/orders/${id}`, { method: 'DELETE' })
      .then(res => {
        if (!res.ok) throw new Error('Не удалось удалить');
        setOrders(orders.filter(o => o.id !== id));
        if (selectedOrder?.id === id) {
          setSelectedOrder(null);
          setOrderItems([]);
        }
      })
      .catch(err => {
        alert('Ошибка: ' + err.message);
      });
  };

  // Обновление заказа
  const handleUpdate = (orderData) => {
    fetch(`${API_BASE}/admin/orders/${orderData.id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(orderData)
    })
      .then(res => {
        if (!res.ok) throw new Error('Ошибка обновления');
        return res.json();
      })
      .then(updated => {
        setOrders(orders.map(o => o.id === updated.id ? updated : o));
        setSelectedOrder(updated);
      })
      .catch(err => {
        alert('Ошибка: ' + err.message);
      });
  };

  if (loading) return <div className="card">Загрузка...</div>;
  if (error) return <div className="card" style={{ color: 'red' }}>{error}</div>;

  // Найти название позиции
  const getItemName = (dish_id, bar_item_id) => {
    if (dish_id) {
      const d = dishes.find(x => x.id === dish_id);
      return d ? `🍽️ ${d.name}` : `Блюдо ID ${dish_id}`;
    }
    if (bar_item_id) {
      const b = barItems.find(x => x.id === bar_item_id);
      return b ? `🍷 ${b.name}` : `Напиток ID ${bar_item_id}`;
    }
    return '—';
  };

  return (
    <div className="card">
      <h2>Заказы</h2>

      {/* Детали выбранного заказа */}
      {selectedOrder && (
        <div style={{ marginBottom: '20px', padding: '12px', border: '1px solid #ddd', borderRadius: '6px', background: '#f9f9f9' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <h3>Заказ #{selectedOrder.id} (Стол {selectedOrder.table_number || '—'})</h3>
            <button onClick={() => setSelectedOrder(null)} style={{ background: '#6c757d', fontSize: '12px', padding: '2px 6px' }}>← Назад</button>
          </div>
          <p><strong>Статус:</strong> {selectedOrder.status}</p>
          <p><strong>Итог:</strong> {selectedOrder.total_price} ₽</p>
          <p><strong>Создан:</strong> {new Date(selectedOrder.created_at).toLocaleString('ru-RU')}</p>

          <h4>Позиции:</h4>
          {orderItems.length > 0 ? (
            <table style={{ width: '100%', marginTop: '8px' }}>
              <thead><tr><th>Позиция</th></tr></thead>
              <tbody>
                {orderItems.map(item => (
                  <tr key={item.id}>
                    <td>{getItemName(item.dish_id, item.bar_item_id)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          ) : (
            <p>Нет позиций</p>
          )}

          <OrderEditForm
            order={selectedOrder}
            onUpdate={handleUpdate}
          />
        </div>
      )}

      {/* Список заказов */}
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Стол</th>
            <th>Статус</th>
            <th>Итог</th>
            <th>Дата</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          {orders.map(o => (
            <tr key={o.id}>
              <td>{o.id}</td>
              <td>{o.table_number || '—'}</td>
              <td>{o.status}</td>
              <td>{o.total_price || 0} ₽</td>
              <td>{new Date(o.created_at).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td>
              <td>
                <button
                  onClick={() => setSelectedOrder(o)}
                  style={{ fontSize: '12px', padding: '2px 6px', marginRight: '4px' }}
                >
                  📋 Детали
                </button>
                <button
                  onClick={() => handleDelete(o.id)}
                  style={{ fontSize: '12px', padding: '2px 6px', background: '#dc3545' }}

const AdminUsersTab = () => {
  const [users, setUsers] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const [showForm, setShowForm] = React.useState(false);
  const [editingUser, setEditingUser] = React.useState(null);

  // Отображение ролей на русском
  const roleLabels = {
    superuser: 'Администратор системы',
    cook: 'Повар',
    waiter: 'Официант'
  };

  const roleOptions = [
    { value: 'superuser', label: 'Администратор системы' },
    { value: 'cook', label: 'Повар' },
    { value: 'waiter', label: 'Официант' }
  ];

  // Загрузка
  React.useEffect(() => {
    fetch(`${API_BASE}/admin/admins`)
      .then(res => {
        if (!res.ok) throw new Error('Не удалось загрузить админ-аккаунты');
        return res.json();
      })
      .then(data => {
        setUsers(Array.isArray(data) ? data : []);
        setLoading(false);
      })
      .catch(err => {
        setError(err.message);
        setLoading(false);
      });
  }, []);

  // Сохранение
  const handleSave = (userData) => {
    // Пароль не отправляем, если редактируем (если не меняем)
    // Бэкенд должен сам хешировать при создании/изменении
    const url = editingUser
      ? `${API_BASE}/admin/admins/${editingUser.id}`
      : `${API_BASE}/admin/admins`;
    const method = editingUser ? 'PUT' : 'POST';

    fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(userData)
    })
      .then(res => {
        if (!res.ok) throw new Error(res.statusText || 'Ошибка сохранения');
        return res.json();
      })
      .then(savedUser => {
        if (editingUser) {
          setUsers(users.map(u => u.id === savedUser.id ? savedUser : u));
        } else {
          setUsers([...users, savedUser]);
        }
        setShowForm(false);
        setEditingUser(null);
      })
      .catch(err => {
        alert('Ошибка: ' + err.message);
      });
  };

  // Удаление
  const handleDelete = (id) => {
    if (!confirm('Удалить админ-аккаунт?')) return;
    fetch(`${API_BASE}/admin/admins/${id}`, { method: 'DELETE' })
      .then(res => {
        if (!res.ok) throw new Error('Не удалось удалить');
        setUsers(users.filter(u => u.id !== id));
      })
      .catch(err => {
        alert('Ошибка: ' + err.message);
      });
  };

  // Редактирование
  const handleEdit = (user) => {
    setEditingUser(user);
    setShowForm(true);
  };

  if (loading) return <div className="card">Загрузка...</div>;
  if (error) return <div className="card" style={{ color: 'red' }}>{error}</div>;

  return (
    <div className="card">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <h2>Админ-аккаунты</h2>
        <button onClick={() => setShowForm(true)}>➕ Добавить аккаунт</button>
      </div>

      {showForm && (
        <AdminUserForm
          user={editingUser}
          onSave={handleSave}
          onCancel={() => {
            setShowForm(false);
            setEditingUser(null);
          }}
        />
      )}

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Логин</th>
            <th>Роль</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          {users.map(u => (
            <tr key={u.id}>
              <td>{u.id}</td>
              <td>{u.login}</td>
              <td>{roleLabels[u.role] || u.role}</td>
              <td>
                <button onClick={() => handleEdit(u)} style={{ fontSize: '12px', padding: '2px 6px', marginRight: '4px' }}>✏️</button>
                <button onClick={() => handleDelete(u.id)} style={{ fontSize: '12px', padding: '2px 6px', background: '#dc3545' }}>🗑️</button>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
};

            {categories.map(cat => (
              <option key={cat.id} value={cat.id}>{cat.name}</option>
            ))}
          </select>
        </div>
        
        <label style={{ display: 'block', marginTop: '8px' }}>
          <input name="is_available" type="checkbox" checked={data.is_available} onChange={handleChange} />
          Доступно

        <div style={{ marginTop: '12px' }}>

const ReviewForm = ({ review, users, orders, onSave, onCancel }) => {
  const [data, setData] = React.useState({
    user_id: review?.user_id || (users.length > 0 ? users[0].id : ''),
    order_id: review?.order_id || (orders.length > 0 ? orders[0].id : ''),
    rating: review?.rating || 5,
    comment: review?.comment || ''
  });

  const handleChange = (e) => {
    const { name, value } = e.target;
    setData(prev => ({ ...prev, [name]: value }));
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    const newReview = {
      ...review,
      user_id: parseInt(data.user_id) || 0,
      order_id: parseInt(data.order_id) || 0,
      rating: parseInt(data.rating) || 5,
      comment: data.comment.trim()
    };
    if (!newReview.user_id || !newReview.order_id || newReview.rating < 1 || newReview.rating > 5) {
      alert('Укажите пользователя, заказ и оценку от 1 до 5');
      return;
    }
    onSave(newReview);
  };

  return (
    <div style={{ marginBottom: '16px', padding: '12px', border: '1px solid #ddd', borderRadius: '6px', background: '#f9f9f9' }}>
      <h3>{review ? 'Редактировать отзыв' : 'Новый отзыв'}</h3>
      <form onSubmit={handleSubmit}>
        <div>
          <select name="user_id" value={data.user_id} onChange={handleChange} required style={{width: '100%', padding: '6px', marginTop: '4px'}}>
            <option value="">— Пользователь —</option>
            {users.map(u => (
              <option key={u.id} value={u.id}>{u.name}</option>
            ))}
          </select>
        </div>
        <div>
          <select name="order_id" value={data.order_id} onChange={handleChange} required style={{width: '100%', padding: '6px', marginTop: '4px'}}>
            <option value="">— Заказ —</option>
            {orders.map(o => (
              <option key={o.id} value={o.id}>Заказ #{o.id}</option>
            ))}
          </select>
        </div>
        <div>
          <label>Оценка:</label>
          <select name="rating" value={data.rating} onChange={handleChange} style={{marginLeft: '8px'}}>
            {[1,2,3,4,5].map(n => <option key={n} value={n}>{n} ⭐</option>)}
          </select>
        </div>
        <div>
          <textarea
            name="comment"
            placeholder="Комментарий"
            value={data.comment}
            onChange={handleChange}
            rows="3"
            style={{width: '100%', marginTop: '8px'}}
            required
          />
        </div>
        <div style={{ marginTop: '12px' }}>
          <button type="submit">Сохранить</button>
          <button type="button" onClick={onCancel} style={{ background: '#6c757d', marginLeft: '8px' }}>Отмена</button>
        </div>
      </form>
    </div>
  );
};

//============================================================================

const AdminUserForm = ({ user, onSave, onCancel }) => {
  const [data, setData] = React.useState({
    login: user?.login || '',
    password: '', // пароль вводится только при создании/смене
    role: user?.role || 'waiter'
  });

  const handleChange = (e) => {
    const { name, value } = e.target;
    setData(prev => ({ ...prev, [name]: value }));
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    const payload = {
      login: data.login.trim(),
      role: data.role
    };

    // Пароль обязателен только при создании
    if (!user || data.password) {
      if (data.password.length < 4) {
        alert('Пароль должен быть не короче 4 символов');
        return;
      }
      payload.password = data.password;
    }

    if (!payload.login) {
      alert('Введите логин');
      return;
    }

    onSave(payload);
  };

  return (
    <div style={{ marginBottom: '16px', padding: '12px', border: '1px solid #ddd', borderRadius: '6px', background: '#f9f9f9' }}>
      <h3>{user ? 'Редактировать аккаунт' : 'Новый админ-аккаунт'}</h3>
      <form onSubmit={handleSubmit}>
        <div><input name="login" placeholder="Логин *" value={data.login} onChange={handleChange} required /></div>
        <div><input name="password" type="password" placeholder={user ? "Новый пароль (если менять)" : "Пароль *"} value={data.password} onChange={handleChange} /></div>
        
        <div>
          <select name="role" value={data.role} onChange={handleChange} required style={{width:'100%', padding:'6px', marginTop:'4px'}}>
            <option value="">— Роль —</option>
            <option value="superuser">Администратор системы</option>
            <option value="cook">Повар</option>
            <option value="waiter">Официант</option>
          </select>
        </div>

        <div style={{ marginTop: '12px' }}>
          <button type="submit">Сохранить</button>
          <button type="button" onClick={onCancel} style={{ background: '#6c757d', marginLeft: '8px' }}>Отмена</button>
        </div>
      </form>
    </div>
  );
};

    // ============= ОСНОВНОЕ ПРИЛОЖЕНИЕ =============
    const App = () => {
  const [isLoggedIn, setIsLoggedIn] = React.useState(false);
  const [userRole, setUserRole] = React.useState(null);

  // Проверка при загрузке: если есть токен — попробуем восстановить сессию
  React.useEffect(() => {
    const token = localStorage.getItem('admin_token');
    const role = localStorage.getItem('admin_role');
    if (token && role) {
      // Можно сделать проверку токена через API, но для упрощения — доверяем localStorage
      setIsLoggedIn(true);
      setUserRole(role);
    }
  }, []);

  const handleLogin = (role) => {
    setIsLoggedIn(true);
    setUserRole(role);
  };

  if (!isLoggedIn) {
    return <Login onLogin={handleLogin} />;
  }

  return <AdminPanel userRole={userRole} />;
};

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
